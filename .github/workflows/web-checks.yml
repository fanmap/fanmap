name: FanMap web checks
on:
  push:
    branches: [website-functional, main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generated release sources
        run: |
          set -euo pipefail
          node scripts/build-web-assets.cjs
          node --check assets/web-app.js
          git diff --exit-code -- assets/data/team-base.js assets/vendor/
          mkdir -p test-results
      - name: Run every directory and core regression with failure propagation
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false jsdom@30.0.1
          node tests/web-app.cjs 2>&1 | tee test-results/core.log
          for test in tests/location-import.cjs tests/nfl-watch-scope.cjs tests/team-presentation.cjs tests/verified-locations.cjs; do
            node "$test" 2>&1 | tee -a test-results/core.log
          done
      - name: Install browser test engines
        run: |
          set -euo pipefail
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Test desktop and mobile browser flows
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 > test-results/server.log 2>&1 &
          FANMAP_BROWSER=chromium python tests/web-browser.py 2>&1 | tee test-results/chromium.log
          FANMAP_BROWSER=webkit python tests/web-browser.py 2>&1 | tee test-results/webkit.log
      - name: Package checked source
        if: always()
        run: git archive --format=zip HEAD -o fanmap-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanmap-web-checks
          path: |
            test-results/
            fanmap-source.zip
          retention-days: 3
