name: FanMap open access checks
on:
  push:
    branches: [temporary-open-access, main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public application
        run: |
          set -euo pipefail
          node scripts/build-web-assets.cjs
          git diff --exit-code -- assets/data/team-base.js assets/vendor/
          node scripts/build-public.cjs
          node --check assets/web-app.js
          node --check assets/open-access.js
          mkdir -p test-results
      - name: Check restored public app and preserve backend authorization tests
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false jsdom@30.0.1
          for test in tests/open-access.cjs tests/web-app.cjs tests/location-import.cjs tests/nfl-watch-scope.cjs tests/team-presentation.cjs tests/verified-locations.cjs; do
            node "$test" 2>&1 | tee -a test-results/core.log
          done
          node --test tests/account-api.mjs 2>&1 | tee test-results/account-policy.log
      - name: Install browser engines
        run: |
          set -euo pipefail
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Test real public app on desktop and mobile
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory public-build > test-results/server.log 2>&1 &
          for browser in chromium webkit; do
            FANMAP_BROWSER="$browser" python tests/web-browser.py 2>&1 | tee "test-results/$browser.log"
            FANMAP_BROWSER="$browser" python tests/open-access-browser.py 2>&1 | tee "test-results/$browser-open.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanmap-open-access-checks
          path: |
            test-results/*open-home.png
            test-results/*.log
          retention-days: 3
