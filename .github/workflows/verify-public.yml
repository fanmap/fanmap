name: Verify live FanMap release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public release files
        run: python3 scripts/verify-public.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanmap-public-release
          path: test-results/public-release.json
          if-no-files-found: ignore
          retention-days: 7
